[project]
name = "firetrace-backend"
version = "1.0.0"
description = "FIRETRACE backend: global NASA FIRMS MODIS/VIIRS fire intelligence API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed full-width FIRMS CSV header lines.
"tests/*" = ["E501"]
